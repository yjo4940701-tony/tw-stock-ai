name: Update Fundamentals

on:
  schedule:
    - cron: '0 18 * * 0'   # 每週日 18:00 UTC（週一凌晨 2 點台灣時間）
  workflow_dispatch:         # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 跑之前先拉最新，避免最後 push 衝突
      - name: Pull latest
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch fundamentals
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_fundamentals.py

      # 無論成功失敗，都上傳 artifact 當備份（7天內可手動下載）
      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-${{ github.run_id }}
          path: data/fundamentals.json
          retention-days: 7

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          git diff --staged --quiet || git commit -m "chore: update fundamentals $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push

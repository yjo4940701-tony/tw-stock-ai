name: Update Fundamentals

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 4 個平行 job，各自負責不同區段的股票代號
        range: ["1000-1999", "2000-2999", "3000-4999", "5000-9999"]
      fail-fast: false   # 一個失敗不影響其他

    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch fundamentals (${{ matrix.range }})
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          STOCK_RANGE: ${{ matrix.range }}
        run: python scripts/fetch_fundamentals.py
      - name: Upload partial result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-${{ matrix.range }}
          path: data/fundamentals-${{ matrix.range }}.json
          retention-days: 3

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all partial results
        uses: actions/download-artifact@v4
        with:
          path: data/parts/
      - name: Merge all parts
        run: |
          python3 - <<'EOF'
          import json, os, glob
          from datetime import datetime

          merged = {}
          for f in glob.glob("data/parts/*/*.json"):
              try:
                  data = json.load(open(f))
                  merged.update(data.get("stocks", {}))
                  print(f"Merged {f}: {len(data.get('stocks', {}))} stocks")
              except Exception as e:
                  print(f"Skip {f}: {e}")

          print(f"Total merged: {len(merged)} stocks")
          os.makedirs("data", exist_ok=True)
          with open("data/fundamentals.json", "w") as out:
              json.dump({"updated": datetime.now().strftime("%Y-%m-%d"), "stocks": merged},
                        out, ensure_ascii=False, separators=(",", ":"))
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          git diff --staged --quiet || git commit -m "chore: update fundamentals $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push

name: Update Fundamentals

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        range: ["1000-1999", "2000-2999", "3000-4999", "5000-9999"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch fundamentals (${{ matrix.range }})
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          STOCK_RANGE: ${{ matrix.range }}
        run: python scripts/fetch_fundamentals.py
      - name: Upload partial result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-${{ matrix.range }}
          path: data/fundamentals-${{ matrix.range }}.json
          retention-days: 3

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Download all partial results
        uses: actions/download-artifact@v4
        with:
          path: data/parts/

      # 1. 先合併財務報表
      - name: Merge financial statements
        run: |
          python3 - <<'EOF'
          import json, os, glob
          from datetime import datetime

          # 保留舊的月營收欄位
          REV_KEYS = {"rev_yoy","rev_cum_yoy","rev_mom","rev_ym","rev_d"}
          existing = {}
          if os.path.exists("data/fundamentals.json"):
              try:
                  existing = json.load(open("data/fundamentals.json")).get("stocks", {})
              except Exception:
                  pass

          merged = {}
          for f in glob.glob("data/parts/*/*.json"):
              try:
                  data = json.load(open(f))
                  merged.update(data.get("stocks", {}))
                  print(f"Merged {f}: {len(data.get('stocks', {}))} stocks")
              except Exception as e:
                  print(f"Skip {f}: {e}")

          # 把舊的月營收資料補回新資料
          for sid, old in existing.items():
              rev = {k: v for k, v in old.items() if k in REV_KEYS}
              if rev:
                  if sid in merged:
                      merged[sid].update(rev)
                  else:
                      merged[sid] = rev

          print(f"Total merged: {len(merged)} stocks")
          os.makedirs("data", exist_ok=True)
          with open("data/fundamentals.json", "w") as out:
              json.dump({"updated": datetime.now().strftime("%Y-%m-%d"), "stocks": merged},
                        out, ensure_ascii=False, separators=(",", ":"))
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          git diff --staged --quiet || git commit -m "chore: update fundamentals $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git pull --rebase origin main
          git push

name: Build OHLCV（全市場日K）

on:
  schedule:
    - cron: '30 6 * * 1-5'    # 台灣時間 14:30（收盤後，OHLC 已出齊）
    - cron: '0 8 * * 1-5'     # 台灣時間 16:00（備援，萬一 14:30 資料未齊）
  workflow_dispatch:          # 手動觸發（測試/首次建底用）
    inputs:
      backfill:
        description: '回補天數（留空=增量；首次建底填 730）'
        required: false
        default: ''
      force:
        description: '允許 backfill 覆蓋成更短的現有檔（保險，預設 false）'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build OHLCV（增量；手動可帶 backfill）
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            FORCE=""
            if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
            python scripts/build_ohlcv.py --backfill ${{ github.event.inputs.backfill }} $FORCE
          else
            python scripts/build_ohlcv.py
          fi

      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ohlcv.json.gz
          git diff --staged --quiet || git commit -m "data: update ohlcv [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push failed, retry $i/3..."
            sleep 10
          done

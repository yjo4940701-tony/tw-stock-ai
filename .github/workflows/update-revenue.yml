name: Update Revenue

on:
  schedule:
    - cron: '0 2 11 * *'  # 每月11日 10:00 AM 台灣時間
  workflow_dispatch:
    inputs:
      range:
        description: '股票範圍（all = 全部同時跑）'
        required: false
        default: '1000-1999'
        type: choice
        options:
          - 1000-1999
          - 2000-2999
          - 3000-4999
          - 5000-9999
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        range: ${{ fromJSON(github.event_name == 'schedule' || github.event.inputs.range == 'all' && '["1000-1999","2000-2999","3000-4999","5000-9999"]' || format('["{0}"]', github.event.inputs.range)) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch revenue (${{ matrix.range }})
        env:
          STOCK_RANGE: ${{ matrix.range }}
        run: python scripts/fetch_revenue.py
      - name: Upload partial result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-${{ matrix.range }}
          path: data/revenue-${{ matrix.range }}.json
          retention-days: 7

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull origin main
      - name: Download partial results
        uses: actions/download-artifact@v4
        with:
          path: data/parts/
      - name: Merge revenue into fundamentals
        run: |
          python3 - <<'EOF'
          import json, os, glob
          from datetime import datetime

          rev_map = {}
          for f in glob.glob("data/parts/*/*.json"):
              try:
                  data = json.load(open(f))
                  rev_map.update(data)
                  print(f"Loaded {f}: {len(data)} stocks")
              except Exception as e:
                  print(f"Skip {f}: {e}")

          print(f"本次更新：{len(rev_map)} 檔")

          with open("data/fundamentals.json", encoding="utf-8") as f:
              fund = json.load(f)

          stocks = fund.get("stocks", {})
          for sid, rv in rev_map.items():
              if sid in stocks:
                  stocks[sid].update(rv)
              else:
                  stocks[sid] = rv

          fund["rev_updated"] = datetime.now().strftime("%Y-%m-%d")
          fund["stocks"] = stocks

          with open("data/fundamentals.json", "w", encoding="utf-8") as f:
              json.dump(fund, f, ensure_ascii=False, separators=(",", ":"))

          valid = sum(1 for v in stocks.values() if v.get("rev_yoy") is not None)
          print(f"rev_yoy 累計有值：{valid} 檔")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals.json
          git diff --staged --quiet || git commit -m "chore: update revenue $(date +%Y-%m-%d) (${{ github.event.inputs.range || 'scheduled' }})"
          git pull --rebase origin main
          git pull --rebase origin main
          git push

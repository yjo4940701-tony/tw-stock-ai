name: Crypto Scan（虛擬貨幣訊號掃描）

on:
  schedule:
    - cron: '10 0,4,8,12,16,20 * * *'   # 每 4H（對齊派網 4H 收線 UTC 00/04/08/12/16/20，後 10 分跑）；crypto 24h
  workflow_dispatch:
    inputs:
      test:
        description: '送一則 TG 測試訊息驗證通道（true/false）'
        type: boolean
        required: false
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crypto scan（60MA穿越·4H，有新訊號才推 TG）
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            node scripts/crypto_scan.js --test
          else
            node scripts/crypto_scan.js
          fi

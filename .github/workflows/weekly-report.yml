name: Weekly Report（自選股週報）

on:
  schedule:
    - cron: '0 8 * * 5'    # 台灣時間 週五 16:00（收盤後）
  workflow_dispatch:        # 手動觸發（測試用）

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch macro data for weekly report's macro section
        continue-on-error: true   # 抓失敗也不擋主流程；weekly_report.py 讀不到檔案會自動略過總經段
        run: |
          python scripts/fetch_macro.py
          python scripts/fetch_macro_tw.py
          python scripts/macro_regime.py

      - name: Send weekly report
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_KEY2: ${{ secrets.AI_API_KEY2 }}
        run: python weekly_report.py
